<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trivia Night — Host</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --card: #1a1a24;
    --accent: #f0c040;
    --accent2: #e05a5a;
    --accent3: #5abeaa;
    --text: #f0eee8;
    --muted: #888;
    --border: rgba(255,255,255,0.07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* Ambient background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 40% at 20% 80%, rgba(240,192,64,0.07) 0%, transparent 60%),
      radial-gradient(ellipse 50% 40% at 80% 20%, rgba(90,190,170,0.06) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  #app { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100vh; }

  /* ── LOBBY ── */
  #lobby {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100vh; gap: 32px; padding: 40px;
  }
  .game-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(72px, 12vw, 160px);
    letter-spacing: 0.04em;
    line-height: 1;
    color: var(--accent);
    text-shadow: 0 0 80px rgba(240,192,64,0.3);
  }
  .game-title span { color: var(--text); }
  .join-instruction {
    font-size: clamp(18px, 2.5vw, 28px);
    color: var(--muted);
    text-align: center;
    letter-spacing: 0.02em;
  }
  .join-url {
    font-size: clamp(22px, 3vw, 36px);
    font-weight: 700;
    color: var(--text);
    background: var(--card);
    border: 1px solid var(--border);
    padding: 16px 36px;
    border-radius: 12px;
    letter-spacing: 0.05em;
  }
  .player-grid {
    display: flex; flex-wrap: wrap; gap: 16px; justify-content: center;
    max-width: 900px;
  }
  .player-chip {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 50px;
    padding: 10px 24px;
    font-size: 20px;
    font-weight: 500;
    display: flex; align-items: center; gap: 10px;
    animation: popIn 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }
  .player-chip .dot {
    width: 10px; height: 10px; border-radius: 50%; background: var(--accent3);
  }
  @keyframes popIn {
    from { transform: scale(0.6); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .waiting-msg {
    color: var(--muted); font-size: 18px;
    border: 1px dashed rgba(255,255,255,0.12);
    padding: 20px 40px; border-radius: 12px;
  }
  .start-btn {
    background: var(--accent);
    color: #0a0a0f;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 32px;
    letter-spacing: 0.08em;
    border: none; cursor: pointer;
    padding: 18px 64px;
    border-radius: 12px;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 4px 30px rgba(240,192,64,0.3);
  }
  .start-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 40px rgba(240,192,64,0.45); }
  .start-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

  /* ── GENERATING ── */
  #generating {
    display: none; flex-direction: column; align-items: center; justify-content: center;
    height: 100vh; gap: 28px;
  }
  .spinner {
    width: 60px; height: 60px;
    border: 4px solid rgba(240,192,64,0.15);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .gen-label {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 36px; letter-spacing: 0.1em; color: var(--muted);
  }

  /* ── QUESTION ── */
  #question-screen {
    display: none; flex-direction: column;
    height: 100vh; padding: 40px 60px; gap: 32px;
  }
  .top-bar {
    display: flex; justify-content: space-between; align-items: center;
  }
  .round-label {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px; letter-spacing: 0.12em; color: var(--muted);
  }
  .answer-progress {
    font-size: 18px; color: var(--muted);
    background: var(--card);
    padding: 8px 20px; border-radius: 50px;
    border: 1px solid var(--border);
  }
  .answer-progress span { color: var(--accent); font-weight: 700; }
  .question-box {
    flex: 1; display: flex; align-items: center; justify-content: center;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 40px 60px;
    text-align: center;
  }
  .question-text {
    font-size: clamp(26px, 4vw, 52px);
    font-weight: 700;
    line-height: 1.25;
    letter-spacing: -0.01em;
  }
  .choices-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .choice {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px 28px;
    display: flex; align-items: center; gap: 18px;
    transition: border-color 0.3s, background 0.3s;
    min-height: 80px;
  }
  .choice.correct {
    background: rgba(90,190,170,0.15);
    border-color: var(--accent3);
    box-shadow: 0 0 30px rgba(90,190,170,0.15);
  }
  .choice.incorrect {
    background: rgba(224,90,90,0.08);
    border-color: var(--accent2);
    opacity: 0.5;
  }
  .choice-letter {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px; letter-spacing: 0.08em;
    color: var(--accent);
    min-width: 32px;
  }
  .choice.correct .choice-letter { color: var(--accent3); }
  .choice-text {
    font-size: clamp(16px, 2vw, 22px);
    font-weight: 500;
    line-height: 1.3;
  }

  /* ── RESULTS ── */
  #results-screen {
    display: none; flex-direction: column;
    height: 100vh; padding: 40px 60px; gap: 28px;
  }
  .results-header {
    display: flex; justify-content: space-between; align-items: center;
  }
  .results-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 48px; letter-spacing: 0.08em; color: var(--accent);
  }
  .next-btn {
    background: var(--accent);
    color: #0a0a0f;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 24px; letter-spacing: 0.1em;
    border: none; cursor: pointer;
    padding: 14px 44px; border-radius: 10px;
    transition: transform 0.15s;
    box-shadow: 0 4px 20px rgba(240,192,64,0.25);
  }
  .next-btn:hover { transform: translateY(-2px); }
  .correct-answer-reveal {
    background: var(--card);
    border: 1px solid var(--accent3);
    border-radius: 16px;
    padding: 24px 36px;
    display: flex; align-items: center; gap: 16px;
    box-shadow: 0 0 40px rgba(90,190,170,0.1);
  }
  .correct-label {
    font-size: 13px; font-weight: 700; letter-spacing: 0.15em;
    color: var(--accent3); text-transform: uppercase;
    display: block; margin-bottom: 6px;
  }
  .correct-answer-text { font-size: 26px; font-weight: 700; }
  .players-results {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
    flex: 1;
  }
  .player-result {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    display: flex; flex-direction: column; gap: 12px;
    align-items: center; text-align: center;
    animation: popIn 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  .player-result.got-it {
    border-color: var(--accent3);
    background: rgba(90,190,170,0.08);
  }
  .player-result.missed {
    border-color: var(--accent2);
    background: rgba(224,90,90,0.05);
    opacity: 0.7;
  }
  .result-icon { font-size: 36px; }
  .result-name { font-size: 20px; font-weight: 700; }
  .result-answer { font-size: 14px; color: var(--muted); }
  .result-score {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 32px; color: var(--accent); letter-spacing: 0.05em;
  }
  .score-board {
    display: flex; gap: 16px; flex-wrap: wrap; justify-content: center;
  }

  /* ── FINAL SCORES ── */
  #final-screen {
    display: none; flex-direction: column; align-items: center; justify-content: center;
    height: 100vh; gap: 36px; padding: 40px;
  }
  .final-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(60px, 10vw, 120px);
    color: var(--accent);
    letter-spacing: 0.06em;
    text-shadow: 0 0 60px rgba(240,192,64,0.3);
  }
  .podium {
    display: flex; align-items: flex-end; gap: 12px;
  }
  .podium-place {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: 20px 36px;
    border-radius: 12px 12px 0 0;
    min-width: 180px;
  }
  .podium-place.first { background: rgba(240,192,64,0.2); border: 1px solid var(--accent); height: 220px; justify-content: flex-end; }
  .podium-place.second { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); height: 170px; justify-content: flex-end; }
  .podium-place.third { background: rgba(200,140,80,0.1); border: 1px solid rgba(200,140,80,0.3); height: 130px; justify-content: flex-end; }
  .podium-emoji { font-size: 36px; }
  .podium-name { font-size: 22px; font-weight: 700; }
  .podium-score { font-family: 'Bebas Neue', sans-serif; font-size: 36px; color: var(--accent); }
  .play-again-btn {
    background: transparent;
    color: var(--accent);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px; letter-spacing: 0.1em;
    border: 2px solid var(--accent);
    cursor: pointer; padding: 16px 52px; border-radius: 12px;
    transition: background 0.2s, color 0.2s;
  }
  .play-again-btn:hover { background: var(--accent); color: #0a0a0f; }

  .hidden { display: none !important; }
  .flex { display: flex !important; }
  .flex-col { display: flex !important; flex-direction: column !important; }
</style>
</head>
<body>
<div id="app">

  <!-- LOBBY -->
  <div id="lobby">
    <div class="game-title">TRIVIA<span>NIGHT</span></div>
    <div class="join-instruction">Players — open your browser and go to:</div>
    <div class="join-url" id="join-url">loading...</div>
    <div id="player-grid" class="player-grid">
      <div class="waiting-msg">Waiting for players to join…</div>
    </div>
    <button class="start-btn" id="start-btn" disabled >START GAME</button>
  </div>

  <!-- GENERATING -->
  <div id="generating">
    <div class="spinner"></div>
    <div class="gen-label">Generating Question…</div>
  </div>

  <!-- QUESTION -->
  <div id="question-screen">
    <div class="top-bar">
      <div class="round-label" id="round-label">ROUND 1</div>
      <div class="answer-progress" id="answer-progress"><span>0</span> / <span id="total-players">0</span> answered</div>
    </div>
    <div class="question-box">
      <div class="question-text" id="question-text"></div>
    </div>
    <div class="choices-grid" id="choices-grid"></div>
  </div>

  <!-- RESULTS -->
  <div id="results-screen">
    <div class="results-header">
      <div class="results-title">RESULTS</div>
      <button class="next-btn" id="next-btn">NEXT ROUND →</button>
    </div>
    <div class="correct-answer-reveal">
      <div>
        <span class="correct-label">Correct Answer</span>
        <div class="correct-answer-text" id="correct-answer-text"></div>
      </div>
    </div>
    <div class="players-results" id="players-results"></div>
  </div>

  <!-- FINAL -->
  <div id="final-screen">
    <div class="final-title">GAME OVER</div>
    <div class="podium" id="podium"></div>
    <button class="play-again-btn" id="play-again-btn">PLAY AGAIN</button>
  </div>

</div>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, get, onValue, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyA3k7kX0fioZSSQ47rXPIJFchbocoVOe9c",
  authDomain: "triv-b7649.firebaseapp.com",
  projectId: "triv-b7649",
  storageBucket: "triv-b7649.firebasestorage.app",
  messagingSenderId: "814483519233",
  appId: "1:814483519233:web:28d92acc2dc0aab0e6cd00",
  databaseURL: "https://triv-b7649-default-rtdb.europe-west1.firebasedatabase.app"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const GAME_ID = "game1";
const TOTAL_ROUNDS = 8;
const GEMINI_API_KEY = "AIzaSyD0GcFFJo6nqRpVFF3lnRowBAebJ1YmwjU";

// ── Single state object ──
const G = {
  players: {},
  scores: {},
  questionBank: [],
  round: 0,
  currentQ: null,
  phase: "lobby",   // lobby | question | results | final
  pollTimer: null,
  countdownTimer: null
};

// ── Boot ──
await set(ref(db, GAME_ID), { status: "lobby", round: 0, question: null, answers: null });
document.getElementById("join-url").textContent = location.origin + "/trivia-player.html";
showScreen("lobby");

// ── Watch players joining ──
onValue(ref(db, `${GAME_ID}/players`), snap => {
  G.players = snap.val() || {};
  const names = Object.values(G.players).map(p => p.name).filter(Boolean);
  const grid = document.getElementById("player-grid");
  if (grid) {
    grid.innerHTML = names.length
      ? names.map(n => `<div class="player-chip"><div class="dot"></div>${n}</div>`).join("")
      : `<div class="waiting-msg">Waiting for players to join…</div>`;
  }
  const btn = document.getElementById("start-btn");
  if (btn) btn.disabled = names.length < 1;
});

// ── Start ──
document.getElementById("start-btn").addEventListener("click", async () => {
  if (G.phase !== "lobby") return;
  G.phase = "working";
  Object.keys(G.players).forEach(id => { G.scores[id] = 0; });
  G.round = 0;
  showScreen("generating");
  await fetchQuestions();
  await update(ref(db, GAME_ID), { status: "playing", scores: G.scores });
  runRound();
});

// ── Run a round ──
async function runRound() {
  G.round++;
  G.phase = "question";

  if (G.round > TOTAL_ROUNDS) {
    runFinal();
    return;
  }

  // Stop any lingering timers
  clearPoll();
  clearCountdown();

  G.currentQ = G.questionBank[G.round - 1];

  // 1. Clear old answers in Firebase
  await set(ref(db, `${GAME_ID}/answers`), null);

  // 2. Push new question to Firebase (players will see it)
  await update(ref(db, GAME_ID), {
    status: "question",
    round: G.round,
    question: {
      question: G.currentQ.question,
      choices: G.currentQ.choices,
      correct: G.currentQ.correct,
      round: G.round
    }
  });

  // 3. Show question screen FIRST, then populate elements
  showScreen("question-screen");
  document.getElementById("round-label").textContent = `ROUND ${G.round} OF ${TOTAL_ROUNDS}`;
  document.getElementById("answer-progress").innerHTML =
    `<span>0</span> / <span id="total-players">${Object.keys(G.players).length}</span> answered`;
  renderChoices(G.currentQ);

  // 4. Poll for answers
  startPoll();
}

// ── Poll Firebase for answers ──
function startPoll() {
  const roundWhenStarted = G.round;
  G.pollTimer = setInterval(async () => {
    if (G.round !== roundWhenStarted || G.phase !== "question") {
      clearPoll(); return;
    }
    const snap = await get(ref(db, `${GAME_ID}/answers`));
    const answers = snap.val() || {};
    const playerCount = Object.keys(G.players).length;
    const answerCount = Object.keys(answers).length;
    const prog = document.getElementById("answer-progress");
    if (prog) prog.innerHTML = `<span>${answerCount}</span> / <span id="total-players">${playerCount}</span> answered`;
    if (playerCount > 0 && answerCount >= playerCount) {
      clearPoll();
      G.phase = "results";
      showResults(answers);
    }
  }, 1000);
}

function clearPoll() {
  if (G.pollTimer) { clearInterval(G.pollTimer); G.pollTimer = null; }
}

function clearCountdown() {
  if (G.countdownTimer) { clearInterval(G.countdownTimer); G.countdownTimer = null; }
}

// ── Show results ──
async function showResults(answers) {
  const q = G.currentQ;
  const correctIdx = q.correct;

  // Flash correct/wrong on choices (still visible for 1.2s)
  q.choices.forEach((_, i) => {
    const el = document.getElementById(`choice-${i}`);
    if (el) el.classList.add(i === correctIdx ? "correct" : "incorrect");
  });
  await sleep(1200);

  // Tally scores
  Object.entries(G.players).forEach(([pid, p]) => {
    const ans = answers[pid];
    if (ans !== undefined && parseInt(ans.choice) === correctIdx) {
      G.scores[pid] = (G.scores[pid] || 0) + 1;
    }
  });

  await update(ref(db, GAME_ID), { scores: G.scores, status: "results" });

  // Build results cards
  const html = Object.entries(G.players).map(([pid, p], idx) => {
    const ans = answers[pid];
    const correct = ans !== undefined && parseInt(ans.choice) === correctIdx;
    return `<div class="player-result ${correct ? "got-it" : "missed"}" style="animation-delay:${idx*0.1}s">
      <div class="result-icon">${correct ? "✅" : "❌"}</div>
      <div class="result-name">${p.name}</div>
      <div class="result-answer">${ans ? q.choices[parseInt(ans.choice)] : "No answer"}</div>
      <div class="result-score">${G.scores[pid] || 0} pts</div>
    </div>`;
  }).join("");

  document.getElementById("correct-answer-text").textContent =
    `${["A","B","C","D"][correctIdx]}. ${q.choices[correctIdx]}`;
  document.getElementById("players-results").innerHTML = html;
  showScreen("results-screen");

  // Countdown to next round
  const isFinal = G.round >= TOTAL_ROUNDS;
  let secs = 6;
  const btn = document.getElementById("next-btn");
  const label = () => isFinal ? `FINAL SCORES IN ${secs}s` : `NEXT ROUND IN ${secs}s`;
  btn.textContent = label();

  // Use a local timer ID so it can always be cleared even after G.countdownTimer is nulled
  let localTimer = null;
  const advance = () => {
    if (G.phase !== "results") return;
    if (localTimer) { clearInterval(localTimer); localTimer = null; G.countdownTimer = null; }
    runRound();
  };

  btn.onclick = advance;

  localTimer = setInterval(() => {
    if (G.phase !== "results") { clearInterval(localTimer); localTimer = null; return; }
    secs--;
    const b = document.getElementById("next-btn");
    if (b) b.textContent = label();
    if (secs <= 0) advance();
  }, 1000);
  G.countdownTimer = localTimer;
}

// ── Final ──
function runFinal() {
  G.phase = "final";
  clearPoll(); clearCountdown();
  const sorted = Object.entries(G.players)
    .map(([id, p]) => ({ name: p.name, score: G.scores[id] || 0 }))
    .sort((a, b) => b.score - a.score);
  const display = [sorted[1], sorted[0], sorted[2]].filter(Boolean);
  const classes = sorted[1] ? ["second","first","third"] : ["first"];
  const emojis = ["🥇","🥈","🥉"];
  document.getElementById("podium").innerHTML = display.map((p, i) => `
    <div class="podium-place ${classes[i]}">
      <div class="podium-emoji">${emojis[sorted.indexOf(p)]}</div>
      <div class="podium-name">${p.name}</div>
      <div class="podium-score">${p.score}</div>
    </div>`).join("");
  update(ref(db, GAME_ID), { status: "final" });
  showScreen("final-screen");
}

// ── Reset ──
document.getElementById("play-again-btn") && document.getElementById("play-again-btn").addEventListener("click", async () => {
  clearPoll(); clearCountdown();
  G.phase = "lobby";
  G.round = 0; G.scores = {}; G.questionBank = []; G.currentQ = null;
  const playersSnap = await get(ref(db, `${GAME_ID}/players`));
  await set(ref(db, GAME_ID), { status: "lobby", round: 0, question: null, answers: null });
  if (playersSnap.val()) await set(ref(db, `${GAME_ID}/players`), playersSnap.val());
  showScreen("lobby");
});

// ── Fetch questions from Gemini ──
async function fetchQuestions() {
  const genLabel = document.querySelector(".gen-label");
  if (genLabel) genLabel.textContent = "Generating Questions…";
  try {
    const prompt = `Generate ${TOTAL_ROUNDS} trivia questions about UK chart music of the 1980s for a party game.
Cover a variety of topics: number one singles, albums, artists, bands, one-hit wonders, lyrics, years songs were released, record labels, etc.
Each question should be distinct and cover a different aspect or artist.
Respond ONLY with a valid JSON array, no markdown, no explanation:
[
  {
    "question": "...",
    "choices": ["A text", "B text", "C text", "D text"],
    "correct": 0
  }
]
The "correct" field is the 0-based index of the correct answer in the choices array.
Make questions fun and suitable for adults. Mix easy, medium and hard difficulty.`;
    const res = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent`,
      { method: "POST", headers: { "Content-Type": "application/json", "x-goog-api-key": GEMINI_API_KEY },
        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { temperature: 0.9 } }) }
    );
    if (!res.ok) {
      const errBody = await res.json().catch(() => ({}));
      const errMsg = errBody?.error?.message || errBody?.error?.status || `HTTP ${res.status}`;
      throw new Error(`Gemini ${res.status}: ${errMsg}`);
    }
    const data = await res.json();
    const text = data.candidates[0].content.parts[0].text.replace(/```json|```/g, "").trim();
    G.questionBank = JSON.parse(text);
    if (genLabel) genLabel.textContent = "Get Ready!";
    await sleep(800);
  } catch(e) {
    console.error("fetchQuestions failed:", e);
    if (genLabel) genLabel.textContent = "Error: " + e.message;
    await sleep(6000);
    G.questionBank = Array.from({length: TOTAL_ROUNDS}, (_, i) => ({
      question: `Question ${i+1} unavailable`, choices: ["A","B","C","D"], correct: 0
    }));
  }
}

// ── Helpers ──
function renderChoices(q) {
  document.getElementById("question-text").textContent = q.question;
  document.getElementById("choices-grid").innerHTML = q.choices.map((c, i) =>
    `<div class="choice" id="choice-${i}">
      <div class="choice-letter">${["A","B","C","D"][i]}</div>
      <div class="choice-text">${c}</div>
    </div>`).join("");
}

function showScreen(id) {
  ["lobby","generating","question-screen","results-screen","final-screen"].forEach(s => {
    const el = document.getElementById(s);
    el.style.display = (s === id) ? "flex" : "none";
    el.style.flexDirection = (s === id) ? "column" : "";
  });
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
</script>
